{{define "title"}}Cylinders — Admin{{end}}
{{define "sidebar"}}
  <a href="/admin/cylinders" class="active">Cylinders</a>
  <a href="/admin/accessories">Accessories</a>
  <a href="/admin/dealers">Dealers</a>
  <a href="/admin/customers">Customers</a>
  <a href="/admin/cities">Cities</a>
  <a href="/admin/requests">Requests</a>
{{end}}
{{define "content"}}
<h1 class="page-title">Gas Cylinders</h1>

<form method="POST" action="/admin/cylinders" class="inline-form">
  <input name="unit_kg" type="number" step="0.5" placeholder="Unit (kg)" required>
  <select name="type" required>
    <option value="domestic">Domestic</option>
    <option value="commercial">Commercial</option>
  </select>
  <input name="price" type="number" step="0.01" placeholder="Price (&#8377;)" required>
  <input name="description" placeholder="Description">
  <button type="submit" class="btn btn-primary btn-sm">Add</button>
</form>

<table class="table">
  <thead><tr><th>Unit (kg)</th><th>Type</th><th>Price</th><th>Description</th><th></th></tr></thead>
  <tbody>
  {{range .Data}}
  <tr id="cyl-{{.ID}}">
    <td>{{.UnitKg}}</td>
    <td><span class="badge {{.Type}}">{{.Type}}</span></td>
    <td>&#8377;{{printf "%.2f" .Price}}</td>
    <td>{{.Description}}</td>
    <td>
      <button class="btn btn-sm btn-danger"
              hx-delete="/admin/cylinders/{{.ID}}"
              hx-target="#cyl-{{.ID}}"
              hx-swap="outerHTML"
              hx-confirm="Delete this cylinder?">Delete</button>
    </td>
  </tr>
  {{end}}
  </tbody>
</table>
{{end}}
